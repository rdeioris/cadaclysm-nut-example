# The web page on GitHub Pages: on every push to main, the nut is built for the browser and
# published with the cadaclysm web package of the cadaclysm-sdk version in Cargo.toml.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # The wasm-bindgen tool must match the wasm-bindgen crate in Cargo.lock.
      - name: Read the versions
        run: |
          echo "WASM_BINDGEN=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)" >> "$GITHUB_ENV"
          echo "CADACLYSM=$(sed -n 's/^cadaclysm-sdk = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_ENV"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN }}

      - name: Build the nut for the browser
        run: |
          cargo build --lib --release --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir web/app target/wasm32-unknown-unknown/release/nut.wasm

      - name: Add the cadaclysm web package
        run: |
          zip="cadaclysm-$CADACLYSM-web.zip"
          curl -fsSLO "https://github.com/rdeioris/cadaclysm-sdk/releases/download/v$CADACLYSM/$zip"
          unzip -q "$zip" "cadaclysm-$CADACLYSM-web/pkg/*"
          mv "cadaclysm-$CADACLYSM-web/pkg" web/pkg

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
