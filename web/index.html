<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cadaclysm nut</title>
<style>
    html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; background: #15171a; color: #e6e6e6; }
    body { display: grid; grid-template-rows: auto minmax(0, 1fr); }
    #status { padding: 8px 12px; color: #9aa0a6; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
</style>
</head>
<body>
<div id="status">loading…</div>
<canvas id="nut"></canvas>
<script type="module">
// app/ is this crate built by wasm-bindgen, pkg/ the cadaclysm web package.
import init, { page_main } from "./app/nut.js";
const status = document.getElementById("status");
// The worker's answer: the nut's summary, and the cadaclysm build it runs on as JSON -- shown
// as its version, and the branch, commit and time it was built from.
const show = ({ summary, build }) => {
    const b = JSON.parse(build);
    status.textContent = `${summary} — cadaclysm ${b.version} · ${b.branch} ${b.commit} · ${b.time.replace("T", " ").replace(/Z$/, " UTC")}`;
};
await init();
try { page_main(show); } catch (e) { status.textContent = e.message ?? e; }
</script>
</body>
</html>
